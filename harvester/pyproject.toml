[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firefly-arp-harvester"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "playwright>=1.49,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
firefly-harvester = "arp_harvester.main:run"

[tool.hatch.build.targets.wheel]
packages = ["arp_harvester"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["arp_harvester"]

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true
